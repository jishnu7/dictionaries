name: Build and publish language packs

# Builds every language artifact from the committed per-language sources in languages/ and
# publishes <lang>.zip + index.json that Indic Keyboard's VarnamDownloadManager downloads.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Data version stamped on every pack'
        required: true
        default: '1'
      langs:
        description: 'Optional space-separated subset of language codes (default: all)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: tools/reverse-translit/go.sum

      - name: Cache varnam tools
        uses: actions/cache@v4
        with:
          path: |
            tools/varnam
            tools/reverse-translit/reverse-translit
          key: varnam-tools-${{ runner.os }}-${{ hashFiles('Makefile', 'tools/reverse-translit/*.go', 'tools/reverse-translit/go.*') }}

      - name: Install the ruby ffi gem
        run: sudo apt-get update && sudo apt-get install -y ruby-ffi

      - name: Build govarnam CLI + reverse-translit
        run: make varnamcli reverse-translit

      - name: Compile scheme VSTs from source
        run: make schemes

      - name: Resolve version and tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF_NAME}"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build packs + index.json
        run: |
          make all \
            VERSION="${{ steps.meta.outputs.version }}" \
            BASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}" \
            LANGS="${{ github.event.inputs.langs }}"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            dist/*.zip
            dist/index.json
